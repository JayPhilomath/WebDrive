<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebDrive - Login</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="panel">
        <h1>WebDrive</h1>
        <p class="subtitle">This share needs a password before files can be listed.</p>

        {% if error %}
        <p class="status-text status-error">{{ error }}</p>
        {% endif %}

        <form method="post" action="/login" class="login-form">
          <input type="hidden" name="next" value="{{ next_url }}" />

          <label class="field-label" for="password">Password</label>
          <input id="password" class="text-input" type="password" name="password" autofocus required />

          <button class="button button-primary login-button" type="submit">Unlock</button>
        </form>
      </div>
    </div>
  </body>
</html>
